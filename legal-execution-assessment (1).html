<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบประเมินพฤติกรรมตามค่านิยมและวัฒนธรรมองค์กร | กรมบังคับคดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2A4A;
    --navy-deep:#081A2E;
    --navy-mid:#173A61;
    --gold:#B8922F;
    --gold-light:#E7CE8C;
    --cream:#F7F4EC;
    --panel:#FFFFFF;
    --ink:#1C2B3A;
    --slate:#5B6B7C;
    --slate-light:#8A97A3;
    --border:#E2DCC9;
    --border-soft:#EEEAE0;
    --success:#2F6B4C;
    --success-bg:#E7F1EA;
    --danger:#A93E2A;
    --danger-bg:#FBEAE5;
    --radius:10px;
    --shadow:0 2px 14px rgba(15,42,74,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Sarabun',-apple-system,'Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  .app-header{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:22px 20px;
    position:relative;
    overflow:hidden;
  }
  .app-header::after{
    content:"";
    position:absolute;
    right:-40px;top:-40px;
    width:180px;height:180px;
    border-radius:50%;
    border:1px solid rgba(231,206,140,0.18);
  }
  .app-header-inner{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    z-index:1;
  }
  .crest{
    flex:none;
    width:46px;height:46px;
    border-radius:50%;
    background:rgba(231,206,140,0.12);
    border:1px solid rgba(231,206,140,0.5);
    display:flex;align-items:center;justify-content:center;
  }
  .app-header h1{
    font-size:16px;
    font-weight:600;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  .app-header p{
    font-size:12.5px;
    margin:0;
    color:var(--gold-light);
    font-weight:400;
  }
  .header-nav{
    max-width:760px;
    margin:0 auto;
    display:flex;
    justify-content:flex-end;
    padding-top:10px;
    position:relative;
    z-index:1;
  }
  .link-btn{
    background:none;border:none;color:rgba(255,255,255,0.72);
    font-size:12.5px;cursor:pointer;text-decoration:underline;
    text-underline-offset:3px;padding:2px 0;
  }
  .link-btn:hover{color:#fff;}
  main{
    max-width:760px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 26px;
  }
  .eyebrow{
    font-size:12px;
    color:var(--gold);
    font-weight:600;
    letter-spacing:0.6px;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  h2.title{
    font-size:21px;
    font-weight:600;
    margin:0 0 14px;
    color:var(--navy);
  }
  .lead{
    font-size:14.5px;
    color:var(--slate);
    margin:0 0 4px;
  }
  .notice-box{
    background:var(--cream);
    border:1px solid var(--border);
    border-left:3px solid var(--gold);
    border-radius:0 8px 8px 0;
    padding:14px 16px;
    font-size:13.5px;
    color:var(--slate);
    margin:18px 0;
  }
  .notice-box b{color:var(--navy);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 26px;
    border-radius:8px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:#fff;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s, transform 0.1s;
  }
  .btn:hover{background:var(--navy-mid);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{
    background:var(--border-soft);
    border-color:var(--border-soft);
    color:var(--slate-light);
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--navy);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{background:var(--cream);}
  .btn-sm{padding:8px 16px;font-size:13.5px;}
  .btn-row{display:flex;gap:10px;margin-top:26px;}
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:500;
    color:var(--navy);
    margin-bottom:6px;
  }
  .field .req{color:var(--danger);margin-left:2px;}
  .field input, .field select{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14.5px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .field select{ cursor:pointer; }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--navy);
    box-shadow:0 0 0 3px rgba(15,42,74,0.08);
  }
  .field .err{
    font-size:12.5px;
    color:var(--danger);
    margin-top:5px;
    display:none;
  }
  .field.has-err input{border-color:var(--danger);}
  .field.has-err .err{display:block;}
  .progress-wrap{
    max-width:760px;
    margin:0 auto;
    padding:14px 20px 0;
  }
  .progress-label{
    font-size:12.5px;
    color:var(--slate);
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  .progress-track{
    height:6px;
    background:var(--border-soft);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--gold-light));
    border-radius:4px;
    transition:width 0.3s ease;
  }
  .q-index{
    font-size:12.5px;
    font-weight:600;
    color:var(--gold);
    letter-spacing:0.5px;
    margin:0 0 10px;
  }
  .q-text{
    font-size:18px;
    font-weight:500;
    color:var(--navy);
    margin:0 0 24px;
    line-height:1.55;
  }
  .choice-list{display:flex;flex-direction:column;gap:10px;}
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    background:#fff;
    transition:border-color 0.12s, background 0.12s;
  }
  .choice:hover{border-color:var(--gold);background:#FEFCF6;}
  .choice.selected{
    border-color:var(--navy);
    background:var(--cream);
  }
  .choice-dot{
    flex:none;
    width:18px;height:18px;
    border-radius:50%;
    border:2px solid var(--border);
    position:relative;
  }
  .choice.selected .choice-dot{border-color:var(--navy);}
  .choice.selected .choice-dot::after{
    content:"";
    position:absolute;
    inset:3px;
    border-radius:50%;
    background:var(--navy);
  }
  .choice-label{font-size:14.5px;color:var(--ink);}
  .thankyou-icon{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--success-bg);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
  }
  .center{text-align:center;}
  footer.foot{
    max-width:760px;margin:0 auto;padding:0 20px 40px;
    font-size:12px;color:var(--slate-light);text-align:center;
  }
  /* ---- Admin ---- */
  .admin-login-card{max-width:400px;margin:60px auto;}
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin:20px 0 8px;
  }
  .stat-card{
    background:var(--cream);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
  }
  .stat-num{font-size:24px;font-weight:600;color:var(--navy);}
  .stat-label{font-size:12px;color:var(--slate);margin-top:2px;}
  .section-title{
    font-size:15px;font-weight:600;color:var(--navy);
    margin:34px 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .qbar-row{
    display:grid;
    grid-template-columns:26px 1fr 74px;
    align-items:center;
    gap:10px;
    padding:7px 0;
    font-size:12.5px;
  }
  .qbar-num{color:var(--slate-light);font-weight:600;}
  .qbar-text{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qbar-track{
    grid-column:1/-1;
    height:8px;background:var(--border-soft);border-radius:4px;overflow:hidden;
    margin-top:2px;margin-bottom:6px;
  }
  .qbar-fill{height:100%;background:var(--navy);border-radius:4px;}
  .qbar-score{color:var(--navy);font-weight:600;text-align:right;}
  .admin-toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    margin:18px 0 4px;
  }
  .admin-toolbar input[type=text]{
    flex:1;min-width:180px;
    padding:9px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:13.5px;font-family:inherit;
  }
  table.resp-table{
    width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;
  }
  table.resp-table th{
    text-align:left;color:var(--slate);font-weight:500;
    font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;
    border-bottom:1px solid var(--border);padding:8px 10px;
  }
  table.resp-table td{
    padding:10px;border-bottom:1px solid var(--border-soft);
    vertical-align:top;
  }
  table.resp-table tr:hover td{background:var(--cream);}
  .score-pill{
    display:inline-block;padding:2px 10px;border-radius:20px;
    background:var(--cream);color:var(--navy);font-weight:600;font-size:12.5px;
    border:1px solid var(--border);
  }
  .row-detail-btn{
    background:none;border:none;color:var(--navy);text-decoration:underline;
    font-size:12.5px;cursor:pointer;padding:0;font-family:inherit;
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,26,46,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:12px;max-width:560px;width:100%;
    max-height:82vh;overflow-y:auto;padding:26px;
  }
  .modal-close{
    float:right;background:none;border:none;font-size:20px;cursor:pointer;
    color:var(--slate);line-height:1;
  }
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--slate);
  }
  .loading-state{
    text-align:center;padding:40px 20px;color:var(--slate);font-size:13.5px;
  }
  .spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--border-soft);border-top-color:var(--navy);
    margin:0 auto 14px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(max-width:520px){
    .card{padding:22px 18px;}
    table.resp-table{display:block;overflow-x:auto;white-space:nowrap;}
  }
</style>
</head>

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function sanitizeKey(s){
  return String(s).trim().toLowerCase().replace(/[\/\\'"\s]/g, "_");
}
function round1(n){ return Math.round(n * 10) / 10; }

const App = {
  page: "intro",
  qIndex: 0,
  general: { name: "", position: "", personnelType: "", department: "" },
  answers: new Array(QUESTIONS.length).fill(null),
  adminOpen: false,
  adminAuthed: false,
  adminLoading: false,
  adminError: "",
  responses: [],
  adminSearch: "",
  adminSort: "date_desc",
  modalResponse: null,

  toggleAdmin(){
    this.adminOpen = !this.adminOpen;
    if (this.adminOpen) {
      this.page = "admin";
      document.getElementById("navToggle").textContent = "กลับไปหน้าแบบประเมิน";
    } else {
      this.page = "intro";
      this.qIndex = 0;
      this.answers = new Array(QUESTIONS.length).fill(null);
      document.getElementById("navToggle").textContent = "สำหรับผู้ดูแลระบบ";
    }
    render();
  },

  goStart(){ this.page = "general"; render(); },

  updateGeneral(key, val){ this.general[key] = val; },

  submitGeneral(){
    let ok = true;
    GENERAL_FIELDS.forEach(f => {
      const el = document.getElementById("gf_" + f.key);
      const wrap = el.closest(".field");
      let val = el.value.trim();
      this.general[f.key] = val;
      let bad = val === "";
      wrap.classList.toggle("has-err", bad);
      if (bad) ok = false;
    });
    if (!ok) return;
    this.page = "question";
    this.qIndex = 0;
    render();
  },

  selectChoice(optIdx){
    this.answers[this.qIndex] = optIdx;
    render();
  },

  backQuestion(){
    if (this.qIndex === 0) { this.page = "general"; render(); return; }
    this.qIndex--; render();
  },

  nextQuestion(){
    if (this.answers[this.qIndex] === null) return;
    if (this.qIndex < QUESTIONS.length - 1) { this.qIndex++; render(); }
    else { this.submitAssessment(); }
  },

  async submitAssessment(){
    if (this.answers.some(a => a === null)) return;
    this.page = "submitting";
    render();
    const answerScores = this.answers.map(idx => OPTIONS[idx].score);
    const total = answerScores.reduce((a,b) => a+b, 0);
    const record = {
      id: sanitizeKey(this.general.name + "|" + this.general.department + "|" + this.general.position),
      name: this.general.name,
      position: this.general.position,
      personnelType: this.general.personnelType,
      department: this.general.department,
      answerScores,
      totalScore: total,
      averageScore: round1(total / QUESTIONS.length),
      submittedAt: new Date().toISOString()
    };
    try {
      await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(record)
      });
      this.page = "thankyou";
    } catch (e) {
      this.page = "submit_error";
    }
    render();
  },

  restartForm(){
    this.general = { name:"", position:"", department:"", email:"" };
    this.answers = new Array(QUESTIONS.length).fill(null);
    this.page = "intro";
    this.qIndex = 0;
    render();
  },

  adminTryLogin(){
    const val = document.getElementById("adminPass").value;
    if (val === ADMIN_PASSWORD) {
      this.adminAuthed = true;
      this.adminError = "";
      this.loadAdminData();
    } else {
      this.adminError = "รหัสผ่านไม่ถูกต้อง";
      render();
    }
  },

  async loadAdminData(){
    this.adminLoading = true;
    this.adminLoadProgress = "กำลังโหลดข้อมูลจาก Google Sheet...";
    render();
    try {
      const res = await fetch(GAS_URL, { method: "GET" });
      const data = await res.json();
      if (data.status !== "ok") throw new Error(data.message || "โหลดข้อมูลไม่สำเร็จ");
      this.responses = (data.responses || []).map(r => ({
        id: r.id,
        name: r.name,
        position: r.position,
        personnelType: r.personnelType,
        department: r.department,
        answerScores: typeof r.answerScores === "string" ? JSON.parse(r.answerScores) : r.answerScores,
        totalScore: Number(r.totalScore),
        averageScore: Number(r.averageScore),
        submittedAt: r.submittedAt
      }));
    } catch (e) {
      this.adminError = "ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง";
    }
    this.adminLoading = false;
    render();
  },

  exportCSV(){
    const rows = [["ชื่อ-นามสกุล","ตำแหน่ง","ประเภทบุคลากร","สังกัด","วันที่ตอบ","คะแนนรวม","คะแนนเฉลี่ย"]
      .concat(QUESTIONS.map((_,i) => "ข้อ " + (i+1)))];
    this.responses.forEach(r => {
      rows.push([
        r.name, r.position, r.personnelType, r.department,
        new Date(r.submittedAt).toLocaleString("th-TH"),
        r.totalScore, r.averageScore
      ].concat(r.answerScores));
    });
    const csv = rows.map(row => row.map(c => '"' + String(c==null?"":c).replace(/"/g,'""') + '"').join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "behavior-assessment-results.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  openDetail(id){
    this.modalResponse = this.responses.find(r => r.id === id) || null;
    render();
  },
  closeDetail(){ this.modalResponse = null; render(); },

  setAdminSearch(v){ this.adminSearch = v; render(); },
  setAdminSort(v){ this.adminSort = v; render(); }
};

function updateProgressBar(){
  const wrap = document.getElementById("progressWrap");
  if (App.page === "question") {
    wrap.style.display = "block";
    const pct = Math.round(((App.qIndex) / QUESTIONS.length) * 100);
    document.getElementById("progressText").textContent = "ข้อที่ " + (App.qIndex+1) + " จาก " + QUESTIONS.length;
    document.getElementById("progressPct").textContent = pct + "%";
    document.getElementById("progressFill").style.width = pct + "%";
  } else if (App.page === "general") {
    wrap.style.display = "block";
    document.getElementById("progressText").textContent = "ส่วนที่ 1: ข้อมูลทั่วไป";
    document.getElementById("progressPct").textContent = "";
    document.getElementById("progressFill").style.width = "5%";
  } else {
    wrap.style.display = "none";
  }
}

    <p class="eyebrow">แบบประเมินพฤติกรรมบุคลากร</p>
    <h2 class="title">การประเมินพฤติกรรมของบุคลากรที่สอดคล้องตามค่านิยม<br>และวัฒนธรรมองค์กรกรมบังคับคดี ประจำปีงบประมาณ พ.ศ. 2569</h2>
    <p class="lead">แบบประเมินฉบับนี้จัดทำขึ้นตามแผนเสริมสร้างค่านิยมและวัฒนธรรมองค์กรกรมบังคับคดี ประจำปีงบประมาณ พ.ศ. 2567–2570 (กิจกรรมที่ 2.4) เพื่อประเมินพฤติกรรมของบุคลากรที่สอดคล้องตามค่านิยมและวัฒนธรรมองค์กร</p>
    <div class="notice-box">
      แบบประเมินประกอบด้วย <b>2 ส่วน</b>: ส่วนที่ 1 ข้อมูลทั่วไป และส่วนที่ 2 แบบประเมินพฤติกรรม จำนวน ${QUESTIONS.length} ข้อ ใช้เวลาประมาณ 5–7 นาที
    </div>
    <div class="btn-row">
      <button class="btn" onclick="App.goStart()">เริ่มทำแบบประเมิน</button>
    </div>
  </div>`;
}

function renderFieldControl(f){
  if (f.type === "select") {
    const opts = f.options.map(o => `<option value="${esc(o)}" ${App.general[f.key]===o?'selected':''}>${esc(o)}</option>`).join("");
    return `<select id="gf_${f.key}"><option value="">กรุณาเลือก</option>${opts}</select>`;
  }
  if (f.type === "select-grouped") {
    const groups = f.groups.map(g => `<optgroup label="${esc(g.label)}">${
      g.options.map(o => `<option value="${esc(o)}" ${App.general[f.key]===o?'selected':''}>${esc(o)}</option>`).join("")
    }</optgroup>`).join("");
    return `<select id="gf_${f.key}"><option value="">กรุณาเลือก</option>${groups}</select>`;
  }
  return `<input type="${f.type}" id="gf_${f.key}" value="${esc(App.general[f.key])}">`;
}

function renderGeneral(){
  const fields = GENERAL_FIELDS.map(f => `
    <div class="field" id="wrap_${f.key}">
      <label for="gf_${f.key}">${esc(f.label)}<span class="req">*</span></label>
      ${renderFieldControl(f)}
      <div class="err">กรุณากรอกข้อมูลนี้ให้ถูกต้อง</div>
    </div>`).join("");
  return `
  <div class="card">
    <p class="eyebrow">ส่วนที่ 1</p>
    <h2 class="title">ข้อมูลทั่วไป</h2>
    <p class="lead" style="margin-bottom:22px;">กรุณากรอกข้อมูลของท่านให้ครบถ้วน</p>
    ${fields}
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="App.page='intro';render();">ย้อนกลับ</button>
      <button class="btn" onclick="App.submitGeneral()">ถัดไป</button>
    </div>
  </div>`;
}

function renderQuestion(){
  const qi = App.qIndex;
  const selected = App.answers[qi];
  const isLast = qi === QUESTIONS.length - 1;
  const choices = OPTIONS.map((opt, i) => `
    <div class="choice ${selected === i ? 'selected' : ''}" onclick="App.selectChoice(${i})">
      <div class="choice-dot"></div>
      <div class="choice-label">${esc(opt.label)}</div>
    </div>`).join("");
  return `
  <div class="card">
    <p class="q-index">ข้อคำถามที่ ${qi+1} จาก ${QUESTIONS.length}</p>
    <p class="q-text">${esc(QUESTIONS[qi])}</p>
    <div class="choice-list">${choices}</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="App.backQuestion()">ย้อนกลับ</button>
      <button class="btn" ${selected === null ? 'disabled' : ''} onclick="App.nextQuestion()">${isLast ? 'ส่งแบบประเมิน' : 'ถัดไป'}</button>
    </div>
  </div>`;
}

function renderSubmitting(){
  return `<div class="card center"><div class="spinner"></div><p class="lead">กำลังบันทึกคำตอบของท่าน...</p></div>`;
}

function renderThankYou(){
  return `
  <div class="card center">
    <div class="thankyou-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#2F6B4C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 class="title">ขอบคุณสำหรับการตอบแบบประเมิน</h2>
    <p class="lead">ระบบได้บันทึกคำตอบของท่านเรียบร้อยแล้ว ข้อมูลของท่านจะถูกนำไปใช้เพื่อการพัฒนาค่านิยมและวัฒนธรรมองค์กรกรมบังคับคดีต่อไป</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-ghost" onclick="App.restartForm()">ตอบแบบประเมินอีกครั้ง</button>
    </div>
  </div>`;
}

function renderSubmitError(){
  return `
  <div class="card center">
    <h2 class="title">บันทึกคำตอบไม่สำเร็จ</h2>
    <p class="lead">เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองส่งแบบประเมินอีกครั้ง</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn" onclick="App.submitAssessment()">ลองอีกครั้ง</button>
    </div>
  </div>`;
}

function renderAdminLogin(){
  return `
  <div class="card admin-login-card">
    <p class="eyebrow">สำหรับผู้ดูแลระบบ</p>
    <h2 class="title">เข้าสู่ระบบผู้ดูแล</h2>
    <div class="field ${App.adminError ? 'has-err' : ''}">
      <label for="adminPass">รหัสผ่านผู้ดูแลระบบ</label>
      <input type="password" id="adminPass" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')App.adminTryLogin()">
      <div class="err">${esc(App.adminError)}</div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="App.adminTryLogin()">เข้าสู่ระบบ</button>
    </div>
    <div class="notice-box" style="margin-top:24px;">
      หน้านี้เป็นการป้องกันเบื้องต้นสำหรับการสาธิตเท่านั้น สำหรับใช้งานจริงกับบุคลากร 3,500 คน ควรเชื่อมต่อระบบยืนยันตัวตนขององค์กร (เช่น ระบบสมาชิกหรือ SSO ของกรมบังคับคดี) แทนรหัสผ่านนี้
    </div>
  </div>`;
}

function computeAdminStats(){
  const n = App.responses.length;
  const totalOfTotals = App.responses.reduce((a,r) => a + r.totalScore, 0);
  const avgOfAverages = n ? round1(App.responses.reduce((a,r) => a + r.averageScore, 0) / n) : 0;
  const perQ = QUESTIONS.map((_, qi) => {
    const sum = App.responses.reduce((a,r) => a + (r.answerScores[qi] || 0), 0);
    return { sum, avg: n ? round1(sum / n) : 0 };
  });
  return { n, totalOfTotals, avgOfAverages, perQ };
}

function renderAdminDashboard(){
  if (App.adminLoading) {
    return `<div class="card"><div class="loading-state"><div class="spinner"></div>${esc(App.adminLoadProgress || "กำลังโหลดข้อมูล...")}</div></div>`;
  }
  if (App.adminError) {
    return `<div class="card center"><p class="lead">${esc(App.adminError)}</p><div class="btn-row" style="justify-content:center;"><button class="btn" onclick="App.loadAdminData()">ลองใหม่</button></div></div>`;
  }
  const stats = computeAdminStats();
  if (stats.n === 0) {
    return `
    <div class="card">
      <p class="eyebrow">แดชบอร์ดผู้ดูแลระบบ</p>
      <h2 class="title">ภาพรวมผลการประเมิน</h2>
      <div class="empty-state">ยังไม่มีผู้ตอบแบบประเมิน<br><button class="btn btn-sm btn-ghost" style="margin-top:14px;" onclick="App.loadAdminData()">โหลดข้อมูลใหม่</button></div>
    </div>`;
  }

  const qbars = stats.perQ.map((q, i) => `
    <div class="qbar-row">
      <span class="qbar-num">${i+1}.</span>
      <span class="qbar-text" title="${esc(QUESTIONS[i])}">${esc(QUESTIONS[i])}</span>
      <span class="qbar-score">${q.avg}/100</span>
      <div class="qbar-track"><div class="qbar-fill" style="width:${q.avg}%;"></div></div>
    </div>`).join("");

  let filtered = App.responses.filter(r => {
    if (!App.adminSearch) return true;
    const s = App.adminSearch.toLowerCase();
    return (r.name||"").toLowerCase().includes(s) ||
           (r.department||"").toLowerCase().includes(s) ||
           (r.position||"").toLowerCase().includes(s) ||
           (r.personnelType||"").toLowerCase().includes(s);
  });
  filtered = filtered.slice().sort((a,b) => {
    if (App.adminSort === "score_desc") return b.totalScore - a.totalScore;
    if (App.adminSort === "score_asc") return a.totalScore - b.totalScore;
    if (App.adminSort === "name_asc") return (a.name||"").localeCompare(b.name||"", "th");
    return new Date(b.submittedAt) - new Date(a.submittedAt);
  });

  const rows = filtered.map(r => `
    <tr>
      <td>${esc(r.name)}</td>
      <td>${esc(r.department)}</td>
      <td>${new Date(r.submittedAt).toLocaleDateString("th-TH")}</td>
      <td><span class="score-pill">${r.totalScore}/${MAX_TOTAL}</span></td>
      <td>${r.averageScore}/100</td>
      <td><button class="row-detail-btn" onclick="App.openDetail('${esc(r.id)}')">ดูรายละเอียด</button></td>
    </tr>`).join("");

  const modal = App.modalResponse ? renderDetailModal(App.modalResponse) : "";

  return `
  <div class="card">
    <p class="eyebrow">แดชบอร์ดผู้ดูแลระบบ</p>
    <h2 class="title">ภาพรวมผลการประเมิน</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${stats.n}</div><div class="stat-label">จำนวนผู้ตอบแบบประเมิน</div></div>
      <div class="stat-card"><div class="stat-num">${stats.avgOfAverages}</div><div class="stat-label">คะแนนเฉลี่ยรวม (เต็ม 100)</div></div>
      <div class="stat-card"><div class="stat-num">${stats.totalOfTotals.toLocaleString("th-TH")}</div><div class="stat-label">ผลรวมคะแนนของผู้ตอบทั้งหมด</div></div>
      <div class="stat-card"><div class="stat-num">${QUESTIONS.length}</div><div class="stat-label">จำนวนข้อคำถาม</div></div>
    </div>

    <div class="section-title">คะแนนเฉลี่ยรายข้อคำถาม</div>
    ${qbars}

    <div class="section-title">รายบุคคล</div>
    <div class="admin-toolbar">
      <input type="text" placeholder="ค้นหาชื่อ ตำแหน่ง หรือสังกัด" value="${esc(App.adminSearch)}" oninput="App.setAdminSearch(this.value)">
      <select onchange="App.setAdminSort(this.value)" style="padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13.5px;">
        <option value="date_desc" ${App.adminSort==='date_desc'?'selected':''}>ล่าสุดก่อน</option>
        <option value="score_desc" ${App.adminSort==='score_desc'?'selected':''}>คะแนนมากไปน้อย</option>
        <option value="score_asc" ${App.adminSort==='score_asc'?'selected':''}>คะแนนน้อยไปมาก</option>
        <option value="name_asc" ${App.adminSort==='name_asc'?'selected':''}>ชื่อ ก-ฮ</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="App.loadAdminData()">โหลดข้อมูลใหม่</button>
      <button class="btn btn-sm" onclick="App.exportCSV()">ส่งออก CSV</button>
    </div>
    <table class="resp-table">
      <thead><tr><th>ชื่อ-นามสกุล</th><th>สังกัด</th><th>วันที่ตอบ</th><th>คะแนนรวม</th><th>เฉลี่ย</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:var(--slate);padding:20px;">ไม่พบข้อมูลที่ค้นหา</td></tr>'}</tbody>
    </table>
  </div>
  ${modal}`;
}

function renderDetailModal(r){
  const rows = QUESTIONS.map((q,i) => `
    <div style="display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px;">
      <span style="color:var(--ink);flex:1;">${i+1}. ${esc(q)}</span>
      <span style="color:var(--navy);font-weight:600;flex:none;">${r.answerScores[i]}</span>
    </div>`).join("");
  return `
  <div class="modal-overlay" onclick="if(event.target===this)App.closeDetail()">
    <div class="modal-box">
      <button class="modal-close" onclick="App.closeDetail()">&times;</button>
      <p class="eyebrow">รายละเอียดคำตอบ</p>
      <h2 class="title" style="font-size:18px;">${esc(r.name)}</h2>
      <p class="lead" style="margin-bottom:4px;">${esc(r.position)} &middot; ${esc(r.personnelType)}</p>
      <p class="lead" style="font-size:12.5px;">${esc(r.department)} &middot; ตอบเมื่อ ${new Date(r.submittedAt).toLocaleString("th-TH")}</p>
      <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
        <div class="stat-card"><div class="stat-num">${r.totalScore}/${MAX_TOTAL}</div><div class="stat-label">คะแนนรวม</div></div>
        <div class="stat-card"><div class="stat-num">${r.averageScore}/100</div><div class="stat-label">คะแนนเฉลี่ย</div></div>
      </div>
      <div class="section-title" style="margin-top:22px;">คะแนนรายข้อ</div>
      ${rows}
    </div>
  </div>`;
}

function render(){
  const el = document.getElementById("app");
  let html = "";
  switch(App.page){
    case "intro": html = renderIntro(); break;
    case "general": html = renderGeneral(); break;
    case "question": html = renderQuestion(); break;
    case "submitting": html = renderSubmitting(); break;
    case "thankyou": html = renderThankYou(); break;
    case "submit_error": html = renderSubmitError(); break;
    case "admin":
      html = App.adminAuthed ? renderAdminDashboard() : renderAdminLogin();
      break;
  }
  el.innerHTML = html;
  updateProgressBar();
  if (App.page === "general") {
    setTimeout(() => {
      const first = document.getElementById("gf_name");
      if (first) first.focus();
    }, 0);
  }
}

render();
</script>
</body>
</html>
